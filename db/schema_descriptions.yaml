# Descrições opcionais de colunas do Banco_Exemplo.
# Formato: tabela -> coluna -> descrição (até 500 caracteres cada).
categorias:
  id: Identificador único da categoria de produtos.
  nome: Nome da categoria (por exemplo, eletrônicos ou papelaria).

produtos:
  id: Identificador único do produto.
  nome: Nome comercial do produto.
  preco: Preço de venda atual do produto, em reais.
  categoria_id: Categoria à qual o produto pertence (referencia categorias.id).

clientes:
  id: Identificador único do cliente.
  nome: Nome completo do cliente.
  cidade: Cidade onde o cliente mora.
  data_cadastro: Data de cadastro do cliente, em texto no formato AAAA-MM-DD.

funcionarios:
  id: Identificador único do funcionário.
  nome: Nome completo do funcionário.
  cargo: Cargo do funcionário na loja (por exemplo, vendedor ou gerente).

pedidos:
  id: Identificador único do pedido.
  cliente_id: Cliente que realizou o pedido (referencia clientes.id).
  funcionario_id: Funcionário que atendeu o pedido (referencia funcionarios.id).
  data_pedido: Data em que o pedido foi feito, em texto no formato AAAA-MM-DD.
  status: Situação atual do pedido no fluxo de atendimento.

itens_pedido:
  id: Identificador único do item do pedido.
  pedido_id: Pedido ao qual o item pertence (referencia pedidos.id).
  produto_id: Produto vendido neste item (referencia produtos.id).
  quantidade: Quantidade de unidades do produto no item.
  preco_unitario: Preço de uma unidade no momento da venda, em reais. O valor do item é quantidade * preco_unitario.
